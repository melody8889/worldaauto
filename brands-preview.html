<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brands Portfolio Preview</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Preview-only styles. Copy into the homepage after approval. */
.brands-preview-section{max-width:none;background:var(--panel);overflow:hidden}
.brands-preview-section .section-intro{max-width:980px;margin:0 auto 28px}
.brands-marquee{overflow:hidden;width:100%;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.brands-track{display:flex;width:max-content;animation:brands-scroll 70s linear infinite}
.brands-marquee:hover .brands-track{animation-play-state:paused}
.brands-group{display:flex;align-items:center;gap:56px;padding-right:56px;flex:none}
.brand-logo{height:70px;width:140px;object-fit:contain;display:block;filter:grayscale(1) contrast(.9);opacity:.78;transition:filter .2s,opacity .2s,transform .2s}
.brand-item:hover .brand-logo{filter:none;opacity:1;transform:scale(1.06)}
.brand-item{display:flex;align-items:center;justify-content:center;flex:none}
.brand-item figcaption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.brand-item figcaption.brand-fallback{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes brands-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:640px){.brands-preview-section{padding-right:0;padding-left:0}.brands-preview-section .section-intro{padding:0 20px}.brands-group{gap:28px;padding-right:28px}.brand-logo{width:105px;height:70px}.brands-marquee{mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}}
</style>
</head>
