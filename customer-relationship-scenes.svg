<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#eee8df"/>
<text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="26" fill="#222">Customer Relationship Scenarios</text>
<g font-family="Arial" font-size="16">
<g transform="translate(35 70)"><rect width="550" height="370" rx="18" fill="#faf7f2" stroke="#ddd"/><rect width="550" height="62" rx="18" fill="#fff"/><circle cx="35" cy="31" r="20" fill="#bbb"/><text x="68" y="37" font-size="20">Maya | AutoLink</text><text x="20" y="92" font-size="18" font-weight="bold">NEW CUSTOMER TRUST</text><g transform="translate(15 115)"><rect width="300" height="44" rx="12" fill="#fff"/><text x="14" y="28">Before I send anything, I need proof.</text><rect x="220" y="58" width="300" height="58" rx="12" fill="#d9fdd3"/><text x="234" y="83">I’ll send our license, warehouse</text><text x="234" y="103">video, and the VIN report.</text><rect y="132" width="340" height="44" rx="12" fill="#fff"/><text x="14" y="160">Can I verify today’s date in the video?</text><rect x="170" y="194" width="350" height="58" rx="12" fill="#d9fdd3"/><text x="184" y="219">Of course. Trust comes before</text><text x="184" y="239">the order.</text></g></g>
<g transform="translate(615 70)"><rect width="550" height="370" rx="18" fill="#faf7f2" stroke="#ddd"/><rect width="550" height="62" rx="18" fill="#fff"/><circle cx="35" cy="31" r="20" fill="#bbb"/><text x="68" y="37" font-size="20">Daniel | Westline Motors</text><text x="20" y="92" font-size="18" font-weight="bold">LONG-TERM COOPERATION</text><g transform="translate(15 115)"><rect width="350" height="44" rx="12" fill="#fff"/><text x="14" y="28">The last four shipments were perfect.</text><rect x="180" y="58" width="340" height="58" rx="12" fill="#d9fdd3"/><text x="194" y="83">I’ll reserve the same inspection</text><text x="194" y="103">team and shipping route.</text><rect y="132" width="330" height="44" rx="12" fill="#fff"/><text x="14" y="160">That’s why I keep coming back.</text><rect x="180" y="194" width="340" height="58" rx="12" fill="#d9fdd3"/><text x="194" y="219">We’ve learned a lot together.</text><text x="194" y="239">Please prepare the invoice.</text></g></g>
<g transform="translate(35 480)"><rect width="550" height="370" rx="18" fill="#faf7f2" stroke="#ddd"/><rect width="550" height="62" rx="18" fill="#fff"/><circle cx="35" cy="31" r="20" fill="#bbb"/><text x="68" y="37" font-size="20">Omar | Prime Auto Hub</text><text x="20" y="92" font-size="18" font-weight="bold">URGENT DELIVERY</text><g transform="translate(15 115)"><rect width="380" height="44" rx="12" fill="#fff"/><text x="14" y="28">The vessel cutoff is tonight!</text><rect x="150" y="58" width="370" height="58" rx="12" fill="#d9fdd3"/><text x="164" y="83">Documents are being corrected.</text><text x="164" y="103">The truck is on standby.</text><rect y="132" width="350" height="44" rx="12" fill="#fff"/><text x="14" y="160">Please update me at every milestone.</text><rect x="150" y="194" width="370" height="58" rx="12" fill="#d9fdd3"/><text x="164" y="219">Approved. Pickup is confirmed</text><text x="164" y="239">for 7:30 PM.</text></g></g>
<g transform="translate(615 480)"><rect width="550" height="370" rx="18" fill="#faf7f2" stroke="#ddd"/><rect width="550" height="62" rx="18" fill="#fff"/><circle cx="35" cy="31" r="20" fill="#bbb"/><text x="68" y="37" font-size="20">Sofia | DrivePoint</text><text x="20" y="92" font-size="18" font-weight="bold">HIGH-SATISFACTION REPEAT ORDER</text><g transform="translate(15 115)"><rect width="390" height="44" rx="12" fill="#fff"/><text x="14" y="28">The cars are better than the photos!</text><rect x="160" y="58" width="360" height="58" rx="12" fill="#d9fdd3"/><text x="174" y="83">I’m glad they worked well for</text><text x="174" y="103">your market.</text><rect y="132" width="340" height="44" rx="12" fill="#fff"/><text x="14" y="160">I sold two within the week.</text><rect x="120" y="194" width="400" height="58" rx="12" fill="#d9fdd3"/><text x="134" y="219">Can you reserve five more vehicles,</text><text x="134" y="239">including two hybrids?</text></g></g></g></svg>
